[package]
name = "google-pagespeed-insights-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

authors = ["uiuifree"]
description = "Async Rust client for the Google PageSpeed Insights API v5: Lighthouse scores and audits, Core Web Vitals field data (CrUX) for a URL and its origin"
license = "MIT"
readme = "README.md"

# crates.io allows at most 5 keywords and 5 categories.
keywords = ["pagespeed", "lighthouse", "core-web-vitals", "seo", "google"]
categories = ["api-bindings", "web-programming", "asynchronous"]

homepage = "https://github.com/uiuifree/rust-google-pagespeed-insights-api"
repository = "https://github.com/uiuifree/rust-google-pagespeed-insights-api"
documentation = "https://docs.rs/google-pagespeed-insights-api"

exclude = [".github/", ".idea/", ".claude/"]

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["full"] }
httpmock = "0.7"
